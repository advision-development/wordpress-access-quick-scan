name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The zip has to come from the version the plugin claims to support, not from
      # whatever happened to be on someone's laptop.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      # Both strings, not only the header. The sibling checks the header alone, and
      # its plugin header and version constant have already drifted a patch apart —
      # so a report recorded a version the release did not have, and nothing caught
      # it. Two literals mean two chances to forget one.
      - name: Tag must match both version strings
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE=wordpress-access-quick-scan/wordpress-access-quick-scan.php
          HEADER=$(sed -n 's/^ \* Version: *\([0-9.]*\).*/\1/p' "$FILE" | head -n1)
          CONST=$(sed -n "s/^define( 'WPAQS_VERSION', '\([0-9.]*\)' );.*/\1/p" "$FILE" | head -n1)

          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "Tag ${GITHUB_REF_NAME} disagrees with the plugin." >&2
            echo "  header:   ${HEADER}" >&2
            echo "  constant: ${CONST}" >&2
            echo "A zip labelled one version while containing another has already" >&2
            echo "happened by hand in the sibling project. Fix whichever is wrong." >&2
            exit 1
          fi

          echo "Tag, header and constant agree on ${HEADER}."

      # build.sh gates on lint, the PHP 7.4 syntax check and the whole suite, so a
      # failure here must stop the release rather than publish anyway.
      - name: Build
        run: ./build.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/wordpress-access-quick-scan-*.zip \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes
